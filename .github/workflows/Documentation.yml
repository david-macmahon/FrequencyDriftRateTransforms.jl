name: Documentation

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "ext/**"
      - "docs/**"
      - "Project.toml"
      - ".github/workflows/Documentation.yml"
    tags:
      - "*"
  pull_request:

permissions:
  contents: write
  pull-requests: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.10"

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v1

      # General must be added explicitly because Pkg only auto-installs it
      # into a depot with no registries at all.  FastQuantiles.jl and
      # NoiseEstimators.jl are resolved from the davidm registry; remove
      # that add if/when they are registered in General.
      - name: Add registries
        run: julia --color=yes -e 'using Pkg; Pkg.Registry.add("General"); Pkg.Registry.add(Pkg.RegistrySpec(url = "https://github.com/david-macmahon/MyJuliaRegistry"))'

      - name: Instantiate docs environment
        run: julia --project=docs -e 'import Pkg; Pkg.develop(path="."); Pkg.instantiate()'

      - name: Build and deploy docs
        run: julia --project=docs docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
          CI: "true"
